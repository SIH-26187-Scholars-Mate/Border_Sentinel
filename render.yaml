# Render Blueprint — hosted backend only (API + WebSocket + Supabase).
# The AI module is NOT deployed here; run it on the machine with the camera
# and set its BACKEND_URL to this service's URL (see README "Deploying").
services:
  - type: web
    name: border-sentinel-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DATABASE_MODE
        value: supabase
      - key: ENABLE_AI_WORKERS
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: AI_SERVICE_KEY
        sync: false        # long random string; the AI module must send the same value
      - key: CORS_ORIGINS
        sync: false        # your Vercel URL, e.g. https://border-sentinel.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: ""
